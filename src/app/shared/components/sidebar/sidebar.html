@if(
nodeService.nodes
  | async;
as nodes
){

<nav class="nav-links">

  @for(
  node of nodes;
  track node._id
  ){

  <div
    class="nav-item"
  >
    @if(
    node.children
      ?.length
    ){

    <button
      class="parent-menu"
      (click)="
        toggleMenu(
          node._id
        )
      "
    >
      <span>
        {{ node.name }}
      </span>

      <span>
        {{
          expandedMenus[
            node._id
          ]
            ? '▼'
            : '▶'
        }}
      </span>
    </button>

    @if(
    expandedMenus[
      node._id
    ]
    ){

    <div
      class="submenu"
    >
      @for(
      child of
      node.children;
      track child._id
      ){

      <a
        [routerLink]="
          child.path
        "
        routerLinkActive="active-link"
      >
        {{
          child.name
        }}
      </a>

      }
    </div>

    }

    } @else {

    <a
      [routerLink]="
        node.path
      "
      routerLinkActive="active-link"
    >
      {{ node.name }}
    </a>

    }
  </div>

  }

</nav>

}
