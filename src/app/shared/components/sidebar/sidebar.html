<div class="sidebar">
  <!-- Logo -->

  <div class="logo">HMS</div>

  <!-- Menu -->

  <div class="menu">
    <!-- ADMIN -->

    <ng-container *ngIf="isAdmin()">
      <a routerLink="/dashboard/admin">Dashboard</a>

      <a routerLink="/employees">Employees</a>

      <a routerLink="/employees/create">Add Employee</a>

      <a routerLink="/employees/pending">Pending Requests</a>
    </ng-container>

    <!-- DOCTOR -->

    <ng-container *ngIf="isDoctor()">
      <a routerLink="/dashboard/doctor">Dashboard</a>

      <a routerLink="/appointments">Appointments</a>

      <a routerLink="/patients">Patients</a>

      <a routerLink="/doctor-availability">Availability</a>
    </ng-container>

    <!-- RECEPTIONIST -->

    <ng-container
      *ngIf="
        isReceptionist()
      "
    >
      <a routerLink="/dashboard/receptionist">Dashboard</a>

      <a routerLink="/patients">Patients</a>

      <a routerLink="/appointments">Appointments</a>

      <a routerLink="/appointments/book">Book Appointment</a>
    </ng-container>
  </div>

  <!-- Logout -->

  <button class="logout-btn" (click)="logout()">Logout</button>
</div>
