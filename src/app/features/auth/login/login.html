<div class="login-page">
  <!-- Left Side -->

  <div class="login-left">
    <div class="overlay">
      <div class="brand-content">
        <div class="logo-box">B</div>

        <h1>BootStrap HMS</h1>

        <p>Modern Smart Healthcare Workspace</p>

        <div class="feature-list">
          <div class="feature-item">
            <span> ✨ </span>

            Digitalized Hospital Management
          </div>

          <div class="feature-item">
            <span> 📅 </span>

            Smart Appointment Scheduling
          </div>

          <div class="feature-item">
            <span> 🩺 </span>

            Advanced Doctor Workflow
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side -->

  <div class="login-right">
    <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="login-header">
        <h2>Welcome Back</h2>

        <p>Login to continue your workspace</p>
      </div>

      <!-- Login ID -->

      <div class="input-group">
        <label> Email or Employee Code </label>

        <input type="text" placeholder="Enter your login ID" formControlName="loginId" />
      </div>

      <!-- Password -->

      <div class="input-group">
        <label> Password </label>

        <input type="password" placeholder="Enter your password" formControlName="password" />
      </div>

      <!-- Forgot -->

      <div class="forgot-row">
        <a routerLink="/forgot-password"> Forgot Password? </a>
      </div>

      <!-- Error -->

      @if(errorMessage){

      <div class="error-box">{{ errorMessage }}</div>

      }

      <!-- Button -->

      <button type="submit" class="login-btn" [disabled]="isSubmitting">
        @if(isSubmitting){ Logging in... } @else { Login }
      </button>

      <!-- Register -->

      <div class="register-text">
        Don’t have an account?

        <a routerLink="/register"> Register </a>
      </div>
    </form>
  </div>
</div>
