<div class="create-password-page">
  <!-- Left Side -->

  <div class="welcome-section">
    <div class="brand-badge">BootStrap HMS</div>

    <h1>Welcome to Your HMS Workspace</h1>

    <p class="welcome-text">
      Create a secure password and configure your recovery question to activate your account.
    </p>

    <div class="feature-list">
      <div class="feature-item">
        <span> 🔐 </span>

        Secure Authentication
      </div>

      <div class="feature-item">
        <span> 🏥 </span>

        Smart Hospital Workflow
      </div>

      <div class="feature-item">
        <span> ⚡ </span>

        Real-time Management
      </div>
    </div>
  </div>

  <!-- Right Side -->

  <div class="form-section glass-card">
    <div class="form-header">
      <h2>Create Password</h2>

      <p>Complete your first login setup</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <!-- Temporary Password -->

      <div class="form-group">
        <label> Temporary Password </label>

        <input
          type="password"
          placeholder="
                  Enter temporary password
                  "
          formControlName="temporaryPassword"
        />
      </div>

      <!-- New Password -->

      <div class="form-group">
        <label> New Password </label>

        <input
          type="password"
          placeholder="
                  Enter new password
                  "
          formControlName="newPassword"
        />
      </div>

      <!-- Confirm Password -->

      <div class="form-group">
        <label> Confirm Password </label>

        <input
          type="password"
          placeholder="
                  Confirm password
                  "
          formControlName="confirmPassword"
        />
      </div>

      <!-- Security Question -->

      <div class="form-group">
        <label> Security Question </label>

        <select formControlName="securityQuestion">
          <option value="">Select Question</option>

          @for( question of securityQuestions; track question ){

          <option [value]="question">{{ question }}</option>

          }
        </select>
      </div>

      <!-- Security Answer -->

      <div class="form-group">
        <label> Security Answer </label>

        <input
          type="text"
          placeholder="
                  Enter security answer
                  "
          formControlName="securityAnswer"
        />
      </div>

      <!-- Submit -->

      <button type="submit" class="submit-btn">Create Password</button>
    </form>
  </div>
</div>
