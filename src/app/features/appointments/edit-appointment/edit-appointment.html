<div class="edit-appointment-container">
  <h1>Edit Appointment</h1>

  <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
    <div class="grid">
      <!-- Doctor -->

      <div class="form-group">
        <label> Doctor </label>

        <select formControlName="doctorEmployeeId" (change)="fetchAvailableSlots()">
          <option value="">Select Doctor</option>

          @for ( doctor of doctors; track doctor._id ) {

          <option [value]="doctor._id">{{ doctor.name }}</option>

          }
        </select>
      </div>

      <!-- Appointment Date -->

      <div class="form-group">
        <label> Appointment Date </label>

        <input type="date" formControlName="appointmentDate" (change)="fetchAvailableSlots()" />
      </div>

      <!-- Appointment Type -->

      <div class="form-group">
        <label> Appointment Type </label>

        <select formControlName="appointmentType">
          <option value="CONSULTATION">Consultation</option>

          <option value="FOLLOW_UP">Follow Up</option>

          <option value="EMERGENCY">Emergency</option>

          <option value="VIDEO_CONSULTATION">Video Consultation</option>

          <option value="ROUTINE_CHECKUP">Routine Checkup</option>
        </select>
      </div>

      <!-- Priority -->

      <div class="form-group">
        <label> Priority </label>

        <select formControlName="priority">
          <option value="NORMAL">Normal</option>

          <option value="URGENT">Urgent</option>

          <option value="CRITICAL">Critical</option>
        </select>
      </div>

      <!-- Payment Status -->

      <div class="form-group">
        <label> Payment Status </label>

        <select formControlName="paymentStatus">
          <option value="PENDING">Pending</option>

          <option value="PAID">Paid</option>

          <option value="INSURANCE">Insurance</option>
        </select>
      </div>

      <!-- Visit Mode -->

      <div class="form-group">
        <label> Visit Mode </label>

        <select formControlName="visitMode">
          <option value="OFFLINE">Offline</option>

          <option value="ONLINE">Online</option>

          <option value="HOME_VISIT">Home Visit</option>
        </select>
      </div>

      <!-- Status -->

      <div class="form-group">
        <label> Status </label>

        <select formControlName="status">
          <option value="BOOKED">Booked</option>

          <option value="IN_CONSULTATION">In Consultation</option>

          <option value="COMPLETED">Completed</option>

          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Slots -->

    @if( appointmentForm .get('status') ?.value !== 'COMPLETED' && appointmentForm .get('status')
    ?.value !== 'CANCELLED' ){

    <div class="slots-section">
      <h2>Available Slots</h2>

      <div class="slots-container">
        @for ( slot of availableSlots; track slot ) {

        <button
          type="button"
          class="slot-btn"
          [class.active]="
                    appointmentForm
                    .get('timeSlot')
                    ?.value === slot
                    "
          (click)="
                    appointmentForm
                    .get('timeSlot')
                    ?.setValue(slot)
                    "
        >
          {{ slot }}
        </button>

        }
      </div>
    </div>

    }

    <!-- Symptoms -->

    <div class="form-group full-width">
      <label> Symptoms </label>

      <textarea
        formControlName="symptoms"
        placeholder="
                Enter symptoms
                "
      ></textarea>
    </div>

    <!-- Reason -->

    <div class="form-group full-width">
      <label> Reason </label>

      <textarea formControlName="reason"></textarea>
    </div>

    <!-- Notes -->

    <div class="form-group full-width">
      <label> Notes </label>

      <textarea formControlName="notes"></textarea>
    </div>

    <!-- Submit -->

    <button type="submit" class="submit-btn" [disabled]="isSubmitting">
      @if(isSubmitting){ Updating... } @else { Update Appointment }
    </button>
  </form>
</div>
