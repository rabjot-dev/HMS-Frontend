name: Deploy Frontend

on:
  push:
    branches:
      - feature/R_SP6

jobs:
  deploy:
    name: Deploy Angular to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_SSH }}

          script: |
            set -e

            echo "========== Frontend Deployment Started =========="

            cd /home/ubuntu/hms_project/HMS_Frontend

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/feature/R_SP6

            echo "Installing dependencies..."
            npm ci

            echo "Building Angular application..."
            npm run build

            echo "Cleaning old deployment..."
            sudo rm -rf /var/www/hms-admin/*

            echo "Copying build to Nginx..."
            sudo cp -r dist/HMS-Frontend/browser/* /var/www/hms-admin/

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Waiting for services..."
            sleep 5

            echo "Checking Backend Health..."
            curl --fail https://bootstraphms.duckdns.org/health

            echo "Checking Frontend..."
            curl --fail https://bootstraphms.duckdns.org/

            echo "========== Frontend Deployment Successful =========="