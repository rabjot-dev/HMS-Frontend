name: Deploy HMS Frontend

on:
  push:
    branches:
      - feature/visagan_sprint_5

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2 Frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_VISAGAN_HOST }}
          username: ${{ secrets.EC2_VISAGAN_USER }}
          key: ${{ secrets.EC2_VISAGAN_SSH }}
          script: |
            set -e
            cd hms_project/HMS-Frontend
            git fetch origin feature/visagan_sprint_5
            git reset --hard origin/feature/visagan_sprint_5
            rm -rf dist
            npm ci
            npx ng build --configuration production
            sudo mkdir -p /var/www/hms-frontend
            sudo rm -rf /var/www/hms-frontend/*
            sudo cp -r dist/HMS-Frontend/browser/* /var/www/hms-frontend/
            sudo systemctl restart nginx
