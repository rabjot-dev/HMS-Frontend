name: Deploy HMS Frontend

on:
  push:
    branches:
      - feature/visagan_sprint_5

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2 Frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_VISAGAN_HOST }}
          username: ${{ secrets.EC2_VISAGAN_USER }}
          key: ${{ secrets.EC2_VISAGAN_SSH }}
          script: |
            cd hms_project/HMS-Frontend
            git pull origin feature/visagan_sprint_5
            npm ci
            sudo ng build --configuration production
            rm -rf /var/www/hms-frontend/*
            cp -r dist/HMS-Frontend/browser/* /var/www/hms-frontend/
            sudo systemctl restart nginx
