name: Deploy Frontend

on:
  push:
    branches:
      - feature/R_SP6

jobs:
  deploy:
    name: Deploy Angular to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_RABJOT }}
          username: ${{ secrets.EC2_RABJOT_USER }}
          key: ${{ secrets.EC2_RABJOT_SSH }}
          script: |
            set -e

            cd /home/ubuntu/hms_project/HMS_Frontend

            LAST_GOOD_FILE=~/hms_project/.frontend_last_good_sha
            PREV_SHA=$(git rev-parse HEAD)
            echo "Currently deployed SHA: $PREV_SHA"

            deploy_sha () {
              TARGET_SHA=$1
              echo "Deploying $TARGET_SHA..."
              git fetch origin
              git reset --hard "$TARGET_SHA"
              npm ci
              npm run build
              sudo rm -rf /var/www/hms-admin/*
              sudo cp -r dist/HMS-Frontend/browser/* /var/www/hms-admin/
              sudo nginx -t
              sudo systemctl reload nginx
              echo "Waiting for services..."
              sleep 5
            }

            health_check () {
              curl --fail --silent --show-error https://bootstraphms.duckdns.org/health
              curl --fail --silent --show-error https://bootstraphms.duckdns.org/
            }

            echo "========== Frontend Deployment Started =========="
            git fetch origin
            NEW_SHA=$(git rev-parse origin/feature/R_SP6)
            deploy_sha "$NEW_SHA"

            echo "Checking backend + frontend health..."
            if health_check; then
              echo "$NEW_SHA" > "$LAST_GOOD_FILE"
              echo "========== Frontend Deployment Successful ($NEW_SHA) =========="
            else
              echo "Health check FAILED for $NEW_SHA. Rolling back to $PREV_SHA..."
              deploy_sha "$PREV_SHA"

              if health_check; then
                echo "$PREV_SHA" > "$LAST_GOOD_FILE"
                echo "Rollback to $PREV_SHA succeeded. Failing this job so the bad deploy gets attention."
              else
                echo "Rollback ALSO failed health check. Manual intervention required immediately."
              fi

              exit 1
            fi
